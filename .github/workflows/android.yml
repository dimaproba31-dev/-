name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q abyss_game.zip -d game
      - name: Setup templates and Android
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.4.1.stable ~/.local/share/godot/export_templates/ || true
          rm -f /root/debug.keystore
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          godot -v -e --quit --headless || true
          cat > ~/.config/godot/editor_settings-4.4.tres <<'EOS'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
      - name: Import and export APK
        run: |
          godot --headless --path game --import || true
          godot --headless --path game --export-debug "Android" "$GITHUB_WORKSPACE/abyss.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: abyss-apk
          path: abyss.apk
